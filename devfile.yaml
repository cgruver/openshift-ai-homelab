schemaVersion: 2.2.0
metadata:
  name: openshift-ai-homelab
components:
- name: workspace-tools
  container:
    image: 'image-registry.openshift-image-registry.svc:5000/workspace-images/ai-home-lab:latest'
    mountSources: true
    memoryRequest: 1Gi
    memoryLimit: 48Gi
    cpuRequest: 100m
    cpuLimit: 4000m
    env:
    - name: SHELL
      value: "/bin/zsh"
    - name: VSCODE_DEFAULT_WORKSPACE
      value: "$(PROJECT_SOURCE)/workspace.code-workspace"
    endpoints:
      - exposure: none
        name: kilo-code
        protocol: tcp
        targetPort: 4096
- volume:
    size: 100Gi
  name: projects

