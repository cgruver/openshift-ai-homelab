kind: ConfigMap
apiVersion: v1
metadata:
  name: ai-tools-configmap
  namespace: openshift-devspaces
  labels:
    app.kubernetes.io/part-of: che.eclipse.org
    app.kubernetes.io/component: workspaces-config
  annotations:
    controller.devfile.io/mount-as: subpath
    controller.devfile.io/mount-path: /globalconfig
data:
  kilo.jsonc: |-
    {
      "$schema": "https://app.kilo.ai/config.json",
      "permission": {
        "bash": "allow",
        "external_directory": {
          "*": "ask",
          "/projects/*": "allow"
        }
      },
      "auto_collapse_reasoning": false,
      "terminal_command_display": "expanded",
      "code_edit_display": "collapsed",
      "mcp_tool_display": "collapsed",
      "default_agent": "ask",
      "mcp": {
        "docs-mcp-server": {
          "type": "remote",
          "url": "https://docs-mcp-server-docs-mcp-server.apps.clg-lab.clg.lab/mcp"
        }
      },
      "enabled_providers": [
        "asus-gx10",
        "mac-mini"
      ],
      "provider": {
        "asus-gx10": {
          "name": "ASUS GX 10",
          "npm": "@ai-sdk/openai-compatible",
          "options": {
            "baseURL": "http://192.168.12.101:8080/v1"
          },
          "models": {
            "laguna-S-2.1": {
              "name": "laguna-S-2.1",
              "limit": {
                "context": 262144,
                "output": 262144
              },
              "reasoning": true
            }
          }
        },
        "mac-mini": {
          "name": "Mac Mini",
          "npm": "@ai-sdk/openai-compatible",
          "options": {
            "baseURL": "http://192.168.12.100:8080/v1"
          },
          "models": {
            "qwen3.8-27b": {
              "name": "qwen3.8-27b",
              "limit": {
                "context": 262144,
                "output": 262144
              },
              "reasoning": true
            }
          }
        }
      },
      "model": "laguna-S-2.1",
      "agent": {
        "plan": {
          "options": {},
          "permission": {}
        },
        "debug": {
          "options": {},
          "permission": {}
        },
        "orchestrator": {
          "options": {},
          "permission": {}
        },
        "ask": {
          "options": {},
          "permission": {}
        },
        "code": {
          "options": {},
          "permission": {}
        }
      }
    }

